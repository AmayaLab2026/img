    <!-- ================= 移液枪 (Pipette) ================= -->
    <g transform="translate(618, 380) rotate(24)" filter="url(#pipShadow)">
        <!-- 以下部件先画，被主体覆盖，形成"插入/连接"的整体感 -->
        <!-- 推杆轴 -->
        <rect class="pip pip-body" x="-7" y="-240" width="14" height="48"/>
        <!-- 顶部按钮 -->
        <rect class="pip pip-red" x="-20" y="-256" width="40" height="17" rx="7"/>
        <!-- 退枪头杆：贴合主体右侧，下端并入颈部 -->
        <polygon class="pip pip-white" points="18,-212 34,-212 34,-30 28,-10 11,24 8,10 18,-12"/>
        <rect class="pip pip-red" x="15" y="-216" width="22" height="16" rx="5"/>
        <rect class="pip pip-red" x="18" y="-196" width="16" height="22"/>
        <!-- 指托挂钩：与主体同色，轮廓连续 -->
        <path class="pip pip-body" d="M-20 -186 C-50 -194 -54 -158 -20 -148 Z"/>

        <!-- 主体：握柄 + 颈部 + 细杆 + 枪头 一体轮廓 -->
        <path class="pip pip-body" d="M-10 -200 H10 Q22 -200 22 -188 V-34 C22 -14 12 -6 9 18 L5 196 L1.5 256 H-1.5 L-5 196 L-9 18 C-12 -6 -22 -14 -22 -34 V-188 Q-22 -200 -10 -200 Z"/>
        <!-- 枪头（白色，与细杆无缝衔接） -->
        <polygon class="pip pip-white" points="-5,196 5,196 1.5,256 -1.5,256"/>
        <!-- 颈部圆环 -->
        <rect class="pip pip-body" x="-11" y="20" width="22" height="9" rx="3"/>
        <!-- 容量显示窗 -->
        <rect class="pip pip-white" x="-9" y="-140" width="18" height="58" rx="4"/>
        <text class="pip-digit" x="0" y="-122">1</text>
        <text class="pip-digit" x="0" y="-110">0</text>
        <text class="pip-digit" x="0" y="-98">0</text>
        <!-- 高光 -->
        <line x1="-15" y1="-176" x2="-15" y2="-46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    </g>
</svg>
