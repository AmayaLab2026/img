            <path d="M 14.00 0.00 A 3.9 3.9 0 0 1 12.12 7.00 A 3.9 3.9 0 0 1 7.00 12.12 A 3.9 3.9 0 0 1 0.00 14.00 A 3.9 3.9 0 0 1 -7.00 12.12 A 3.9 3.9 0 0 1 -12.12 7.00 A 3.9 3.9 0 0 1 -14.00 0.00 A 3.9 3.9 0 0 1 -12.12 -7.00 A 3.9 3.9 0 0 1 -7.00 -12.12 A 3.9 3.9 0 0 1 -0.00 -14.00 A 3.9 3.9 0 0 1 7.00 -12.12 A 3.9 3.9 0 0 1 12.12 -7.00 A 3.9 3.9 0 0 1 14.00 0.00 Z" fill="#FFFFFF" stroke-width="1.5"/>
            <circle r="10.6" fill="none" stroke-width="1"/>
