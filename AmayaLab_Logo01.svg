<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#B1ADA1" flood-opacity="0.25"/>
        </filter>
        <filter id="pipShadow" x="-30%" y="-10%" width="160%" height="120%">
            <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#8C877B" flood-opacity="0.3"/>
        </filter>
    </defs>
    <style>
        .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #B1ADA1; }
        .axis-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #B1ADA1; font-weight: 500; }
        .chart-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #B1ADA1; font-weight: 600; text-anchor: middle; }
        .brand { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; fill: #C15F3C; font-weight: 800; letter-spacing: 1px; }
        .citation { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; fill: #B1ADA1; }
        .pip { stroke: #5B5249; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
        .pip-body { fill: #F4F3EE; }
        .pip-white { fill: #FFFFFF; }
        .pip-red { fill: #C15F3C; }
        .pip-digit { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; fill: #5B5249; text-anchor: middle; }
    </style>

